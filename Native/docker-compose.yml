services:

  marketplace-api:
    build:
      context: ./server
    container_name: marketplace-api
    restart: unless-stopped
    environment:
      PORT: 3001
    networks:
      - internal
      - shared_proxy

  marketplace-app:
    build:
      context: .
    container_name: marketplace-app
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - marketplace-api
    networks:
      - shared_proxy
      - internal

networks:
  internal:
  shared_proxy:
    external: true
