services:

  databricks-api:
    build:
      context: ./server
    container_name: databricks-api
    restart: unless-stopped
    environment:
      PORT: 3001
    networks:
      - internal
      - shared_proxy

  databricks-app:
    build:
      context: .
    container_name: databricks-app
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - databricks-api
    networks:
      - shared_proxy
      - internal

networks:
  internal:
  shared_proxy:
    external: true
